name: Release Dev Toolbox

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '已存在的稳定版本标签，例如 v0.1.6'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify stable version and release tag
        run: node scripts/verify-release.cjs --tag
      - name: Reject overwriting a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release.cjs --remote
      - name: Install dependencies
        run: npm ci
      - name: Check application
        run: npm run check
      - name: Package Windows x64 and verify artifacts
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if ($env:CSC_LINK) {
            npx electron-builder --win nsis --x64 --publish never --config.win.verifyUpdateCodeSignature=true
          } else {
            npx electron-builder --win nsis --x64 --publish never
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:release
      - name: Upload complete release draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Dev Toolbox ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/Dev-Toolbox-*-x64.exe
            release/Dev-Toolbox-*-x64.exe.blockmap
            release/latest.yml
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$env:RELEASE_TAG" --draft=false --latest
